name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/regress.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Las pruebas del motor usan cabeceras POSIX y de macOS (unistd.h, CoreMIDI, arpa/inet.h):
      # en Windows se compila el motor y el programa, sin pruebas, hasta portarlas.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVJ_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --parallel
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build -w vjstudio
        working-directory: ui
      - run: node packaging/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: VJ-Studio-Windows
          path: dist/*.exe
